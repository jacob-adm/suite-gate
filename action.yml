# SPDX-License-Identifier: Apache-2.0
name: suite-gate
description: One verdict for a pull request from the audit tools, with each finding annotated on its file and line.
author: jacob-adm
branding:
  icon: shield
  color: blue

inputs:
  base:
    description: Commit or branch to compare with. Default, on a pull request, origin/ and the base branch.
    required: false
    default: ""
  ref:
    description: Commit or branch to judge.
    required: false
    default: HEAD
  rules:
    description: Rules file in the repository, or a built-in name (ci or default).
    required: false
    default: ci
  lockfile-cache:
    description: Directory release-drift reads packages from instead of the registries.
    required: false
    default: ""
  python-version:
    description: Python the tools run on.
    required: false
    default: "3.13"

outputs:
  verdict:
    description: pass, warn, fail or error.
    value: ${{ steps.gate.outputs.verdict }}
  result:
    description: Path of the gate result object (gate-result/1, JSON).
    value: ${{ steps.gate.outputs.result }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install suite-gate and the audit tools
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$ACTION_PATH" -r "$ACTION_PATH/requirements-tools.txt"
    - name: Gate
      id: gate
      shell: bash
      env:
        GATE_BASE: ${{ inputs.base }}
        GATE_REF: ${{ inputs.ref }}
        GATE_RULES: ${{ inputs.rules }}
        GATE_LOCKFILE_CACHE: ${{ inputs.lockfile-cache }}
      run: python -m suite_gate action
