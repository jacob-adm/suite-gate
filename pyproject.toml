[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-gate"
version = "0.1.0"
description = "A shared result format for command-line audit tools, and an MCP server over them."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
suite-gate = "suite_gate.cli:main"

[tool.setuptools]
packages = ["suite_gate"]

[tool.setuptools.package-data]
suite_gate = ["rules/*.json"]
